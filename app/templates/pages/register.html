{% extends "layouts/base.html" %}

{% block body %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-solar-50 via-white to-amber-50 px-4 py-12">
    <div class="w-full max-w-md">
        <!-- Logo / Brand -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-solar-500 mb-4">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-gray-900">SolarSync</h1>
            <p class="text-gray-500 mt-1">Create your account</p>
        </div>

        <!-- Register Card -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
            {% if errors %}
            <div class="mb-6 p-4 bg-red-50 border border-red-100 rounded-xl">
                <ul class="space-y-1">
                    {% for error in errors %}
                    <li class="text-red-700 text-sm">{{ error }}</li>
                    {% endfor %}
                </ul>
            </div>
            {% endif %}

            <form method="POST" action="/auth/register" class="space-y-5">
                <!-- Name -->
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700 mb-1.5">
                        Full name
                    </label>
                    <input 
                        type="text" 
                        id="name" 
                        name="name" 
                        required
                        minlength="2"
                        value="{{ form_data.name if form_data else '' }}"
                        placeholder="Prashant Wankhede"
                        class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-solar-500 focus:border-solar-500 outline-none transition"
                    >
                </div>

                <!-- Email -->
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1.5">
                        Email address
                    </label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        required
                        value="{{ form_data.email if form_data else '' }}"
                        placeholder="you@example.com"
                        class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-solar-500 focus:border-solar-500 outline-none transition"
                    >
                </div>

                <!-- Phone -->
                <div>
                    <label for="phone" class="block text-sm font-medium text-gray-700 mb-1.5">
                        Phone number
                    </label>
                    <input 
                        type="tel" 
                        id="phone" 
                        name="phone" 
                        required
                        pattern="[0-9]{10}"
                        value="{{ form_data.phone if form_data else '' }}"
                        placeholder="9876543210"
                        class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-solar-500 focus:border-solar-500 outline-none transition"
                    >
                    <p class="mt-1 text-xs text-gray-400">10-digit mobile number</p>
                </div>

                <!-- Password -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1.5">
                        Password
                    </label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        required
                        minlength="6"
                        placeholder="••••••••"
                        class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-solar-500 focus:border-solar-500 outline-none transition"
                    >
                </div>

                <!-- Confirm Password -->
                <div>
                    <label for="confirm_password" class="block text-sm font-medium text-gray-700 mb-1.5">
                        Confirm password
                    </label>
                    <input 
                        type="password" 
                        id="confirm_password" 
                        name="confirm_password" 
                        required
                        minlength="6"
                        placeholder="••••••••"
                        class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-solar-500 focus:border-solar-500 outline-none transition"
                    >
                </div>

                <!-- Submit -->
                <button 
                    type="submit"
                    class="w-full py-2.5 px-4 bg-solar-500 hover:bg-solar-600 text-white font-medium rounded-xl text-sm transition-colors focus:ring-2 focus:ring-offset-2 focus:ring-solar-500"
                >
                    Create account
                </button>
            </form>
        </div>

        <!-- Login link -->
        <p class="text-center mt-6 text-sm text-gray-500">
            Already have an account? 
            <a href="/auth/login" class="text-solar-600 hover:text-solar-700 font-medium">Sign in</a>
        </p>
    </div>
</div>
{% endblock %}
